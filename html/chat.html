<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="F1 2차 프로젝트 당근마켓 클론 코딩">
    <meta name="author" content="김지훈, 전재형, 오수빈, 인마리아">
    <meta name="keywords" content="당근마켓 클론, HTML, CSS, JS, 오르미, 이스트소프트">
    <!-- 공유/검색용 Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="F1 CarrotMarket">
    <meta property="og:description" content="F1 2차 프로젝트 당근마켓 클론 코딩">
    <meta property="og:image" content="../images/favicon.ico">
    <meta property="og:url" content="https://github.com/jhkim-191108/F1">
    <title>채팅</title>

    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/header.css">
    <link rel="stylesheet" href="../css/chat.css" />
    
</head>
<body>
    <!-- 상단Header -->
    <header class="upperBar">
        <!-- header내부 섹션1 : 로고 및 중고거래 동네인증 버튼 -->
        <nav id="upperBarLeft">
        <!-- 로고 이미지 + 홈화면 링크 -->
            <a href="./onboarding.html">
                <img src="../images/logo.png" alt="당근로고" class="upperLogo">
            </a>
            <!-- 로고 이미지 옆 버튼 묶음 div -->
            <!-- 현재 페이지면 주황. 동네인증은 로그인 후에만 보임 -->
            <div class="upperLeftText">
                <a href="./trade.html" id="tradeNav">중고거래</a>
                <a href="./location.html" id="locationNav" hidden>동네인증</a>
            </div>
        </nav>
        <!-- header 내부 섹션2 : flex, gap이 10으로 동일하기 때문에 따로 나눠서 감싸지 않음-->
        <div id="upperBarRight">
            <!-- 검색창 js로 엔터눌러 검색 등을 하기 위해 form으로 감쌈-->
            <!-- 작은 화면은 돋보기로 검색창을 열고 닫음 -->
            <div class="searchWrap">
                <button type="button" id="searchToggle" aria-label="검색 열기" aria-expanded="false">
                    <img src="../images/icon-search.svg" alt="돋보기버튼">
                </button>
                <form id="searchForm">
                    <input type="search" name="search" id="searchTextArea" placeholder="물품이나 동네를 검색해보세요">
                </form>
            </div>
            <!-- 로그아웃 상태에서만 보일 버튼 -->
            <div id="logoutStatusHeader">
                <a href="./login.html" id="upperLoginButton">로그인</a>
            </div>
            
            <!-- 로그인 상태에서만 보일 버튼 -->
            <div id="loginStatusHeader" hidden>
                <!-- 채팅하기버튼 -->
                <a href="./chat.html" id="upperChatButton">채팅하기</a>
                <!-- 로그아웃버튼 -->
                <button type="button" id="upperLogoutButton">로그아웃</button>
                <!-- 프로필 버튼 -->
                <div class="profileDropdown">
                    <button type="button" id="profileButton" aria-label="프로필 메뉴" aria-expanded="false">
                        <img src="../images/profile.svg" alt="" class="defaultIcon"/>
                    </button>
                    <!-- 모바일에서만 열림. 데스크톱은 프로필 클릭 시 마이페이지 -->
                    <ul id="dropdownMenu" hidden>
                        <li><a href="./mypage.html">마이페이지</a></li>
                        <li><a href="./chat.html">채팅</a></li>
                        <li><button type="button" class="dropdown-logout">로그아웃</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <main class="main">
        <!-- 채팅: 왼쪽 목록 / 오른쪽 대화 -->
        <section class="chat-content">
            <!-- 채팅 목록. JS에서 방을 채움 -->
            <div class="chat-list-container">
                <div class="chat-info">
                    <h1 class="chat-info-id"></h1>
                    <!-- 안읽은 방만 보기 -->
                    <label class="chat-unread-toggle">
                        <span>읽지 않은 채팅</span>
                        <input type="checkbox" id="unreadToggle" />
                        <span class="chat-unread-switch"></span>
                    </label>
                </div>

                <div class="chat-ai">
                    <div class="chat-ai-icon-wrap">
                        <img src="../images/icon-bot.png" alt="AI 챗봇" class="chat-ai-icon" />
                    </div>
                    <div class="chat-ai-text">
                        <p class="chat-ai-title">AI 챗봇</p>
                        <p class="chat-ai-desc">궁금한 내용을 물어보세요!</p>
                    </div>
                    
                </div>

                <ul class="chat-room-list" id ="chatRoomList">
                </ul>
            </div>

            <!-- 채팅방. 상대 정보 + 말풍선 + 입력 -->
            <div class="chat-content-container">
                <div class="chat-empty" id="chatEmpty">
                    <p>채팅방을 선택하면<br>대화가 여기에 표시됩니다.</p>
                </div>
                <div class="chat-room-header">
                    <!-- 모바일에서 목록으로 돌아가기 -->
                    <button type="button" class="chat-back-btn" id="chatBackBtn" aria-label="채팅 목록으로">
                        <img src="../images/icon-back.png" alt="뒤로가기">
                    </button>
                    <div class="chat-room-header-user">
                        <div class="chat-room-header-top">
                            <h2 class="chat-room-header-id"></h2>
                            <span class="chat-manner-temp"></span>
                        </div>
                        <p class="chat-room-header-location"></p>
                    </div>
                    <!-- ... 메뉴. 나가기만 -->
                    <button type="button" class="chat-more-btn" id="chatMoreBtn" aria-label="더보기" aria-expanded="false">
                        <img src="../images/icon-kebab.png" alt="케밥메뉴">
                    </button>
                </div>

                <!-- 이 채팅이 연결된 상품. 왼쪽은 상세, 오른쪽 상태로 거래중 변경 -->
                <div class="chat-product-row">
                    <a class="chat-product-bar" id="chatProductLink">
                        <div class="chat-product-thumb"></div>
                        <div class="chat-product-info">
                            <p class="chat-product-title"></p>
                            <p class="chat-product-price"></p>
                        </div>
                    </a>
                    <div class="chat-product-status-wrap">
                        <button type="button" class="chat-product-status" id="chatProductStatus"></button>
                        <ul class="chat-status-menu" id="chatStatusMenu" hidden>
                            <li><button type="button" data-status="on_sale">거래중</button></li>
                            <li><button type="button" data-status="reserved">예약중</button></li>
                            <li><button type="button" data-status="sold">거래완료</button></li>
                        </ul>
                    </div>
                </div>

                <!-- 말풍선. JS에서 채움. 상대만 프로필 -->
                <div class="chat-message-area" id="chatMessageArea"></div>

                <form class="chat-input-area" id="chatSendForm">
                    <textarea class="chat-input" id="chatInput" placeholder="메시지 보내기" rows="1"></textarea>
                    <button type="submit" class="chat-send-btn">전송</button>
                </form>

                <!-- ... 누르면 열리는 하단 메뉴. 나가기 + 닫기 -->
                <div class="chat-menu-overlay" id="chatMenuOverlay">
                    <div class="chat-menu-sheet" role="dialog" aria-label="채팅방 메뉴">
                        <div class="chat-menu-handle"></div>
                        <button type="button" class="chat-menu-leave" id="chatLeaveBtn">
                            <img src="../images/icon-trashcan.png" alt="채팅나가기">
                            채팅방 나가기
                        </button>
                        <button type="button" class="chat-menu-close" id="chatMenuClose">닫기</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="../js/modal.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/chat.js"></script>

</body>
</html>
