<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="../images/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="F1 2차 프로젝트 당근마켓 클론 코딩" />
    <meta name="author" content="김지훈, 전재형, 오수빈, 인마리아" />
    <meta name="keywords" content="당근마켓 클론, HTML, CSS, JS, 오르미, 이스트소프트" />
    <!-- 공유/검색용 Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="F1 CarrotMarket" />
    <meta property="og:description" content="F1 2차 프로젝트 당근마켓 클론 코딩" />
    <meta property="og:image" content="../images/favicon.ico" />
    <meta property="og:url" content="https://github.com/jhkim-191108/F1" />
    <title>중고거래 글쓰기</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/write.css" />
    <link rel="stylesheet" href="../css/header.css" />
  </head>
  <body>
    <!-- 글쓰기/수정. ?id= 있으면 수정 모드 -->
    <!-- 헤더 -->
    <!-- 상단Header -->
    <header class="upperBar">
        <!-- header내부 섹션1 : 로고 및 중고거래 동네인증 버튼 -->
        <nav id="upperBarLeft">
        <!-- 로고 이미지 + 홈화면 링크 -->
            <a href="./onboarding.html">
                <img src="../images/logo.png" alt="당근로고" class="upperLogo">
            </a>
            <!-- 로고 이미지 옆 버튼 묶음 div -->
            <!-- 현재 페이지면 주황. 동네인증은 로그인 후에만 보임 -->
            <div class="upperLeftText">
                <a href="./trade.html" id="tradeNav">중고거래</a>
                <a href="./location.html" id="locationNav" hidden>동네인증</a>
            </div>
        </nav>
        <!-- header 내부 섹션2 : flex, gap이 10으로 동일하기 때문에 따로 나눠서 감싸지 않음-->
        <div id="upperBarRight">
            <!-- 검색창 js로 엔터눌러 검색 등을 하기 위해 form으로 감쌈-->
            <!-- 작은 화면은 돋보기로 검색창을 열고 닫음 -->
            <div class="searchWrap">
                <button type="button" id="searchToggle" aria-label="검색 열기" aria-expanded="false">
                    <img src="../images/icon-search.svg" alt="돋보기버튼">
                </button>
                <form id="searchForm">
                    <input type="search" name="search" id="searchTextArea" placeholder="물품이나 동네를 검색해보세요">
                </form>
            </div>
            <!-- 로그아웃 상태에서만 보일 버튼 -->
            <div id="logoutStatusHeader">
                <a href="./login.html" id="upperLoginButton">로그인</a>
            </div>
            
            <!-- 로그인 상태에서만 보일 버튼 -->
            <div id="loginStatusHeader" hidden>
                <!-- 채팅하기버튼 -->
                <a href="./chat.html" id="upperChatButton">채팅하기</a>
                <!-- 로그아웃버튼 -->
                <button type="button" id="upperLogoutButton">로그아웃</button>
                <!-- 프로필 버튼 -->
                <div class="profileDropdown">
                    <button type="button" id="profileButton" aria-label="프로필 메뉴" aria-expanded="false">
                        <img src="../images/profile.svg" alt="" class="defaultIcon"/>
                    </button>
                    <!-- 모바일에서만 열림. 데스크톱은 프로필 클릭 시 마이페이지 -->
                    <ul id="dropdownMenu" hidden>
                        <li><a href="./mypage.html">마이페이지</a></li>
                        <li><a href="./chat.html">채팅</a></li>
                        <li><button type="button" class="dropdown-logout">로그아웃</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <!-- 메인 -->
    <main>
      <!-- 메인 컨테이너 -->
      <div class="main-con">
        <!-- 글쓰기 콘텐츠 -->
        <article class="write">
          <!-- 콘텐츠 - 이미지 + 제목 + 가격 -->
          <div class="write-box-1">
            <!-- 사진. 클릭하면 파일 선택 후 서버 업로드 -->
            <label class="img-box" for="write-image">
              <span class="icon-camera" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M9 7.5h1.2l.8-1.2A1.5 1.5 0 0 1 12.25 5.5h0.5A1.5 1.5 0 0 1 14 6.3l.8 1.2H16.5A2.5 2.5 0 0 1 19 10v6.5A2.5 2.5 0 0 1 16.5 19h-9A2.5 2.5 0 0 1 5 16.5V10A2.5 2.5 0 0 1 7.5 7.5H9Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                  <circle cx="12" cy="13" r="2.6" stroke="currentColor" stroke-width="1.6"/>
                </svg>
              </span>
              <span class="img-count">0/1</span>
              <input type="file" id="write-image" accept="image/*" hidden />
              <img class="preview" alt="선택한 사진" hidden>
            </label>
            <!-- 글 정보 -->
            <div class="write-info">
              <!-- 글 제목 -->
              <div class="write-title-box input-box">
                <!-- 글 제목 - 텍스트 -->
                <label for="write-title">글 제목</label>
                <!-- 글 제목 - 입력란 -->
                <input
                  type="text"
                  id="write-title"
                  name="title"
                  placeholder="글 제목"
                />
              </div>
              <!-- 가격 -->
              <div class="write-price-box input-box">
                <!-- 가격 - 텍스트 -->
                <label for="write-price">가격</label>
                <!-- 가격 - 입력란 -->
                <input
                  type="text"
                  id="write-price"
                  name="price"
                  placeholder="가격"
                />
              </div>
            </div>
          </div>

          <!-- 콘텐츠 - 물품 설명 + 거래 희망 장소-->
          <div class="write-box-2">
            <!-- 물품 설명 -->
            <div class="write-desc-box input-box">
              <!-- 물품 설명 - 텍스트 -->
              <label for="write-desc">물품 설명</label>
              <!-- 물품 설명 - 입력란 -->
              <textarea
                name="desc"
                id="write-desc"
                placeholder="게시글 내용을 작성해주세요."
              ></textarea>
            </div>

            <!-- 거래 희망 장소 -->
            <div class="write-place-box input-box">
              <!-- 거래 희망 장소 - 텍스트 -->
              <label for="write-place">거래 희망 장소</label>
              <!-- 거래 희망 장소 - 입력란 -->
              <input
                type="text"
                id="write-place"
                name="place"
                placeholder="거래를 희망하는 장소"
              />
            </div>
          </div>

          <!-- 완료. 새 글은 POST, 수정은 PATCH -->
          <button class="btn-done">완료</button>
        </article>
      </div>
    </main>
    <script src="../js/modal.js"></script>
    <script src="../js/write.js"></script>
    <script src="../js/header.js"></script>
  </body>
</html>
