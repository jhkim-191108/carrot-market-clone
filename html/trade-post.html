<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="../images/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="F1 2차 프로젝트 당근마켓 클론 코딩" />
    <meta name="author" content="김지훈, 전재형, 오수빈, 인마리아" />
    <meta name="keywords" content="당근마켓 클론, HTML, CSS, JS, 오르미, 이스트소프트" />
    <!-- 공유/검색용 Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="F1 CarrotMarket" />
    <meta property="og:description" content="F1 2차 프로젝트 당근마켓 클론 코딩" />
    <meta property="og:image" content="../images/logo.png" />
    <meta property="og:url" content="https://github.com/jhkim-191108/F1" />
    <title>중고거래 상세</title>
    <link rel="stylesheet" href="../css/common.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <link rel="stylesheet" href="../css/trade-post.css" />
    <link rel="stylesheet" href="../css/header.css" />
  </head>
  <body>
    <!-- 거래 게시글 -->
    <!-- 헤더 -->
    <!-- 상단Header -->
    <header class="upperBar">
        <!-- header내부 섹션1 : 로고 및 중고거래 동네인증 버튼 -->
        <nav id="upperBarLeft">
        <!-- 로고 이미지 + 홈화면 링크 -->
            <a href="./onboarding.html">
                <img src="../images/logo.png" alt="당근로고" class="upperLogo">
            </a>
            <!-- 로고 이미지 옆 버튼 묶음 div -->
            <!-- 현재 페이지면 주황. 동네인증은 로그인 후에만 보임 -->
            <div class="upperLeftText">
                <a href="./trade.html" id="tradeNav">중고거래</a>
                <a href="./location.html" id="locationNav" hidden>동네인증</a>
            </div>
        </nav>
        <!-- header 내부 섹션2 : flex, gap이 10으로 동일하기 때문에 따로 나눠서 감싸지 않음-->
        <div id="upperBarRight">
            <!-- 검색창 js로 엔터눌러 검색 등을 하기 위해 form으로 감쌈-->
            <!-- 작은 화면은 돋보기로 검색창을 열고 닫음 -->
            <div class="searchWrap">
                <button type="button" id="searchToggle" aria-label="검색 열기" aria-expanded="false">
                    <img src="../images/icon-search.svg" alt="돋보기버튼">
                </button>
                <form id="searchForm">
                    <input type="search" name="search" id="searchTextArea" placeholder="물품이나 동네를 검색해보세요">
                </form>
            </div>
            <!-- 로그아웃 상태에서만 보일 버튼 -->
            <div id="logoutStatusHeader">
                <a href="./login.html" id="upperLoginButton">로그인</a>
            </div>
            
            <!-- 로그인 상태에서만 보일 버튼 -->
            <div id="loginStatusHeader" hidden>
                <!-- 채팅하기버튼 -->
                <a href="./chat.html" id="upperChatButton">채팅하기</a>
                <!-- 로그아웃버튼 -->
                <button type="button" id="upperLogoutButton">로그아웃</button>
                <!-- 프로필 버튼 -->
                <div class="profileDropdown">
                    <button type="button" id="profileButton" aria-label="프로필 메뉴" aria-expanded="false">
                        <img src="../images/profile.svg" alt="" class="defaultIcon"/>
                    </button>
                    <!-- 모바일에서만 열림. 데스크톱은 프로필 클릭 시 마이페이지 -->
                    <ul id="dropdownMenu" hidden>
                        <li><a href="./mypage.html">마이페이지</a></li>
                        <li><a href="./chat.html">채팅</a></li>
                        <li><button type="button" class="dropdown-logout">로그아웃</button></li>
                    </ul>
                </div>
            </div>
        </div>
    </header>
    <!-- 메인 -->
    <main>
      <!-- 메인 컨테이너 -->
      <div class="main-con">
        <!-- 뒤로가기 버튼 -->
        <div class="btn-back-box">
          <button class="btn-back">
            <span>&lt;</span>
            <span>뒤로가기</span>
          </button>
        </div>
        <!-- 게시글 콘텐츠 -->
        <article class="post">
          <!-- 콘텐츠 - 이미지 -->
          <div class="img-box">
            <img src="../images/write-add-img.png" alt="게시글 이미지">
          </div>
          <!-- 콘텐츠 - 프로필 + 채팅하기 버튼 -->
          <div class="post-box-1">
            <!-- 콘텐츠 - 프로필 -->
            <div class="post-profile">
              <!-- 프로필 - 아이디-->
              <span class="post-id"></span>
              <!-- 프로필 - 지역-->
              <span class="post-loc"></span>
            </div>
            <!-- 채팅하기. 방 만들고 chat.html로 이동 -->
            <button class="btn-chat">채팅하기</button>
          </div>

          <!-- 라인 -->
          <div class="line"></div>

          <!-- 콘텐츠 - 게시글 정보 -->
          <div class="post-box-2">
            <!-- 게시글 정보 - 게시글 제목 -->
            <h1 class="post-title"></h1>
            <!-- 게시글 정보 - 부가 정보 -->
            <div class="post-sub">
              <!-- 부가 정보 - 가격 -->
              <span class="post-price"></span>
              <!-- 부가 정보 - 조회, 채팅 -->
              <div class="stat">
                <span>조회</span>
                <span class="view-num"></span>
                <span class="devider">|</span>
                <span>채팅</span>
                <span class="chat-num"></span>
              </div>
            </div>
          </div>

          <!-- 콘텐츠 - 본문 -->
          <div class="post-content">
            <!-- 본문 - 텍스트 -->
            <p class="post-text"></p>
          </div>

          <!-- 콘텐츠 - 거래 장소 -->
          <div class="post-place">
            <span>희망 거래장소</span>
            <span class="devider">|</span>
            <span class="place-text"></span>
          </div>

          <!-- 본인 글일 때만 보임. JS에서 hidden 해제 -->
          <div class="post-btn-box">
            <!-- DELETE /api/products/:id -->
            <button class="btn-delete" id="btnDelete">삭제하기</button>
            <span class="devider">|</span>
            <!-- write.html?id= 로 이동해서 수정 -->
            <button class="btn-edit" type="button">수정하기</button>
          </div>
        </article>
      </div>
    </main>
    <script src="../js/modal.js"></script>
    <script src="../js/trade-post.js"></script>
    <script src= "../js/header.js"></script>
  </body>
</html>
